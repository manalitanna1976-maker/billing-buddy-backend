[project]
name = "billing-buddy-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 (last released 2020) probes `bcrypt.__about__.__version__`
    # to detect the backend version; bcrypt>=4.1 removed that attribute,
    # which makes passlib's bcrypt handler misbehave (raises a spurious
    # "password cannot be longer than 72 bytes" on well-under-72-byte
    # passwords). Pin bcrypt below that break until passlib ships a fix.
    "bcrypt<4.1",
    "python-multipart>=0.0.12",
    "weasyprint>=62",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
